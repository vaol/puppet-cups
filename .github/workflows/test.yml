on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: 3.2.0
            puppet: 8
            fixtures: .fixtures.yml
            allow_failure: false
    env:
      PUPPET_GEM_VERSION: "~> ${{ matrix.puppet }}.0"
    name: Puppet ${{ matrix.puppet }} (Ruby ${{ matrix.ruby }} fixtures=${{ matrix.fixtures }})
    steps:
      - uses: actions/checkout@v4
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          bundler: '2.4.13'
      - name: Validate
        run: bundle exec rake check:symlinks check:git_ignore check:dot_underscore check:test_file rubocop syntax lint metadata_lint
      - name: Run tests
        run: bundle exec rake parallel_spec
  release:
    name: PuppetForge release, GitHub release, GitHub pages
    needs: test
    if: ${{ github.ref == 'refs/heads/release' }}
    runs-on: ubuntu-24.04
    env:
      BLACKSMITH_FORGE_PASSWORD: ${{ secrets.BLACKSMITH_FORGE_PASSWORD }}
      BLACKSMITH_FORGE_URL: ${{ secrets.BLACKSMITH_FORGE_URL }}
      BLACKSMITH_FORGE_USERNAME: ${{ secrets.BLACKSMITH_FORGE_USERNAME }}
      PUPPET_GEM_VERSION: '~> 8'
      X_GITHUB_TOKEN: ${{ secrets.X_GITHUB_TOKEN }}
      X_GITHUB_USERNAME: ${{ secrets.X_GITHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: gem install bundler -v 2.4.13
      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      - run: bundle config set without 'acceptance_testing metatools'
      - run: bundle install
      - run: bundle exec rake forge:release
      - run: bundle exec rake github:release
      - run: bundle exec rake github:pages
